openapi: 3.0.1
info:
  title: XtremePlay API
  description: Social gaming platform API with auth, profiles, friends, rooms, rewards, moderation and admin endpoints.
  version: '1.0.0'
servers:
  - url: http://localhost:5003
paths:
  /api/v1/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /api/v1/auth/register:
    post:
      summary: Register a new user
      responses:
        '201':
          description: Created
  /api/v1/auth/login:
    post:
      summary: Log in a user
      responses:
        '200':
          description: OK
  /api/v1/me:
    get:
      summary: Get current profile
      responses:
        '200':
          description: OK
  /api/v1/profile/settings:
    post:
      summary: Update profile settings
      responses:
        '200':
          description: OK
  /api/v1/rewards/daily:
    post:
      summary: Claim daily reward
      responses:
        '200':
          description: OK
  /api/v1/rooms:
    get:
      summary: List rooms
      responses:
        '200':
          description: OK
  /api/v1/rooms/{roomId}/messages:
    get:
      summary: List room messages
      responses:
        '200':
          description: OK
  /api/v1/voice-rooms:
    get:
      summary: List voice rooms
      responses:
        '200':
          description: OK
  /api/v1/leaderboard:
    get:
      summary: List leaderboard entries
      responses:
        '200':
          description: OK
  /api/v1/admin/reports:
    get:
      summary: List moderation reports
      responses:
        '200':
          description: OK
components: {}
